name: Published image runtime check
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published image version
        required: true
        default: '0.2.0'
        type: string
permissions:
  contents: read
  packages: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      CATPROOF_IMAGE: ghcr.io/cat-proof/catproof-community:${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - name: Read package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api orgs/cat-proof/packages/container/catproof-community --jq '{name,visibility,html_url}'
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the published image
        run: ./community.sh start
      - name: Verify HTTPS and restart durability
        run: |
          ./community.sh certificate
          python3 scripts/smoke_local.py --ca catproof-local-ca.crt --restart
          if test -f scripts/smoke_community_limit.py; then python3 scripts/smoke_community_limit.py --ca catproof-local-ca.crt; fi
          docker image inspect "$CATPROOF_IMAGE" --format '{{json .RepoDigests}}'
      - name: Stop test containers
        if: always()
        run: |
          if test -f .env; then docker compose down; fi
