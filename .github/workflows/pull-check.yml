name: Anonymous release image smoke check
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published image version
        required: true
        default: '0.2.0'
        type: string
permissions:
  contents: read
jobs:
  pull-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CATPROOF_IMAGE: ghcr.io/cat-proof/catproof-community:${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - name: Use a clean Docker authentication directory
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/anonymous-docker" >> "$GITHUB_ENV"
      - name: Inspect the public image manifest
        run: docker buildx imagetools inspect "$CATPROOF_IMAGE"
      - name: Start from the downloaded release image
        run: ./community.sh start
      - name: Verify the pulled application
        run: |
          ./community.sh certificate
          python3 scripts/smoke_local.py --ca catproof-local-ca.crt --restart
          if test -f scripts/smoke_community_limit.py; then python3 scripts/smoke_community_limit.py --ca catproof-local-ca.crt; fi
          docker image inspect "$CATPROOF_IMAGE" --format '{{json .RepoDigests}}'
      - name: Stop test containers
        if: always()
        run: |
          if test -f .env; then docker compose down; fi
